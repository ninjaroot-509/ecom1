{% extends "commerce/base.html" %}

{% load i18n %}

{% block  titled %}{% trans "Définir le mot de passe" %}{% endblock titled %}

{% block content %}

    <form method="POST" action="{% url 'account_set_password' %}" class="password_set">

    </form>
{% endblock %}
